services:
  postgres:
    image: postgres:16-alpine
    container_name: papelaria-postgres
    environment:
      POSTGRES_USER: papelaria_app
      POSTGRES_PASSWORD: postdba
      POSTGRES_DB: papelaria_dev
    ports:
      - "5432:5432"
    volumes:
      - papelaria-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papelaria_app -d papelaria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  papelaria-pgdata:
